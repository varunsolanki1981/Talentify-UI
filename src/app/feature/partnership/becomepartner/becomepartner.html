<div class="container">
  <mat-card>
    <h2>Become a Partner 🤝</h2>

    <form [formGroup]="form">

      <mat-form-field appearance="outline">
        <mat-label>Organization Name</mat-label>
        <input matInput formControlName="organizationName">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contact Person</mat-label>
        <input matInput formControlName="contactPerson">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
          <mat-option value="Education">Education</mat-option>
          <mat-option value="Health">Health</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Address</mat-label>
        <textarea matInput formControlName="address"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>About Organization</mat-label>
        <textarea matInput formControlName="description"></textarea>
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="submit()" [disabled]="loading">
        Submit
      </button>

      <mat-progress-spinner *ngIf="loading" diameter="30"></mat-progress-spinner>

      <p *ngIf="success" class="success">
        Thank you! We will contact you soon.
      </p>

    </form>
  </mat-card>
</div>
