<app-breadcrumb></app-breadcrumb>
<div class="container">

    @if (isLoading()) {
    <div class="spinner-overlay">
      <mat-progress-spinner 
        mode="indeterminate" 
        diameter="50">
      </mat-progress-spinner>
      <p>Loading...</p>
    </div>
  }
</div>

<mat-card class="my-card ">
    <!-- <mat-icon color="primary" style="float: right;" (click)="refresh()">refresh</mat-icon> -->
    <mat-card-content style="padding: 24px; ">
        <!-- <button mat-button class="spaced-button btn btn-sm btn-primary icon-container" (click)="refresh()">Refresh <mat-icon iconPositionEnd>refresh</mat-icon></button> -->
        <button type="button" class="spaced-button btn btn-sm btn-primary icon-container" (click)="refresh()"><mat-icon aria-hidden="false" aria-label="Register icon">refresh</mat-icon> Refresh</button>
        <div class="content">
            <!-- The AG Grid component, with Dimensions, CSS Theme, Row Data, and Column Definition -->
            <ag-grid-angular style="width: 100%; height: 550px;" [rowData]="rowData" [columnDefs]="colDefs"
                [rowClassRules]="rowClassRules" (gridReady)="onGridReady($event)" [pagination]="true"
                [defaultColDef]="defaultColDef" (cellValueChanged)="onCellValueChanged($event)"
                (selectionChanged)="onSelectionChanged($event)" (filterOpened)="onFilterOpened($event)"
                (filterChanged)="onFilterChanged($event)" (filterModified)="onFilterModified($event)"
                [paginationAutoPageSize]="true" />
            <!--
            [rowSelection]="rowSelection"
           (rowClicked)="rowClicked($event)" -->
        </div>
    </mat-card-content>
</mat-card>
