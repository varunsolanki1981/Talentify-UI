<mat-toolbar>
    <mat-card-title>Thanks</mat-card-title>
</mat-toolbar>
<mat-card class="my-card">
    <mat-card-content>

        <p style="text-align: center;">Thank you for registering for the upcoming program! We have received your
            registration and you need to do nothing further.</p>
        <p style="text-align: center;">If you have any additional questions, please contact Telentfy at 123-456-7890.
        </p>
        <div style="text-align: center">
            <img src="../../../assets/thankyou.png" alt="Thank You" style="width: 100%; max-width: 400px; margin-top: 20px;">
        </div>
    </mat-card-content>
     <mat-card-actions class="center-actions">
        <button type="button" class="spaced-button btn btn-sm btn-primary" (click)="routToLogin()">LOGIN TO YOUR ACCOUNT</button>
    </mat-card-actions>
</mat-card>
