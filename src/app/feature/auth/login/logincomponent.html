<div class="container">
    @if (isLoading()) {
    <div class="spinner-overlay">
      <mat-progress-spinner 
        mode="indeterminate" 
        diameter="50">
      </mat-progress-spinner>
      <p>Loading...</p>
    </div>
  }
</div>
<div class="login-container" > 
    <mat-card class="login-card"> 
   <mat-card-header class="header-center">
      <mat-card-title>Login</mat-card-title>
   </mat-card-header>
   <mat-card-content style="padding: 24px;">

      <form class="my-form" *ngIf="loginForm" [formGroup]=loginForm (ngSubmit)="login()">
         <mat-form-field [style.width.px]=600 class="col-sm-4 col-md-4 col-lg-4" appearance="outline">
            <mat-label>Email</mat-label>
            <mat-icon matPrefix>mail</mat-icon>
            <input matInput type="usernameOrEmail" formControlName="usernameOrEmail" placeholder="Email address" required>
            <mat-error *ngIf="loginForm.get('usernameOrEmail')?.invalid">Email is required</mat-error>
         </mat-form-field>

         <mat-form-field [style.width.px]=600 class="col-sm-4 col-md-4 col-lg-4" appearance="outline">
            <mat-label>Password</mat-label>
            <mat-icon matPrefix>key</mat-icon>
            <input matInput [type]="showPassword ? 'password' : 'text'" formControlName="password"
               placeholder="Password" required>
            <!-- The toggle button with the eye icon -->
            <button matSuffix mat-icon-button aria-label="Toggle password visibility" (click)="togglePasswordVisibility()" type="button">
               <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.invalid">Password is required</mat-error>
            <!-- <mat-hint align="end">Forgot Password?</mat-hint> -->
            <mat-hint align="end"><a color="primary" routerLink="/forgot">Forgot Password?</a></mat-hint>
         </mat-form-field>
      </form>
   </mat-card-content>
   <mat-card-actions class="actions-center">
      <button type="button" class="spaced-button btn btn-sm btn-primary icon-container" (click)="login()" (keydown.enter)="login()"><mat-icon aria-hidden="false" aria-label="Sign in icon">login</mat-icon> Sign in</button>
      
      <button type="button" class="spaced-button btn btn-sm btn-primary icon-container" (click)="register()"><mat-icon aria-hidden="false" aria-label="Register icon">person_add</mat-icon> Register</button>
      <!-- <button type="button" class="spaced-button btn btn-primary btn-sm" (click)="navigateToForgotPassword()">Forgot Password?</button> -->
   </mat-card-actions>

</mat-card>
</div>
